<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="description" content="映画GIFTの5案のWeb操作プロトタイプ。"><title>映画GIFT｜5案の操作プロトタイプ</title><link id="app-styles" rel="stylesheet" href="style.css?v=20261106-web30"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet"></head>
<body><aside><div class="mast">映画GIFT<span>5案の操作プロトタイプ</span></div><p class="aside-note">企画検討用プロトタイプ<br>決済・送信・実際の予約は行いません。</p><nav id="cases" aria-label="企画を選ぶ"></nav><div id="experience-modes"></div><nav id="steps" aria-label="体験のステップ"></nav><button class="reset" data-action="reset">この案を最初から試す</button></aside><div class="workspace"><div class="device" id="device"></div><section class="context" id="context"></section></div><div id="modal"></div><script>
(async()=>{
 const fallback='20261106-web30';
 async function latest(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),3500);try{const response=await fetch('release.json?check='+Date.now(),{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('release');const data=await response.json();return /^[a-zA-Z0-9-]{1,64}$/.test(data.version)?data.version:fallback;}catch{return null;}finally{clearTimeout(timer);}}
 const release=await latest()||fallback;window.__EIGA_GIFT_RELEASE__=release;
 const styles=document.getElementById('app-styles');
 if(!styles.href.endsWith('v='+release))await new Promise(resolve=>{styles.onload=styles.onerror=resolve;styles.href='style.css?v='+release;setTimeout(resolve,3500);});
 const app=document.createElement('script');app.src='app.js?v='+release;document.body.append(app);
 let checking=false;
 async function checkUpdate(){if(checking||document.visibilityState==='hidden')return;checking=true;try{const next=await latest();if(next&&next!==release)location.reload();}finally{checking=false;}}
 window.addEventListener('pageshow',event=>{if(event.persisted)checkUpdate();});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
})();
</script></body></html>
